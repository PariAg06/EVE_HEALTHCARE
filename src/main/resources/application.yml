spring:
  application:
    name: eve-healthcare-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eve_healthcare}
    username: ${DB_USERNAME:eve}
    password: ${DB_PASSWORD:eve}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-long-random-value-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
